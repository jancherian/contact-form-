<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    form {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
    }
    h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled {
      background: #99c2ff;
      cursor: not-allowed;
    }
    .honeypot { position: absolute; left: -9999px; top: auto; }
    .message { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
    .message.success { background: #d4edda; color: #155724; display: block; }
    .message.error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <form id="contact-form">
    <h2>Contact Us</h2>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <input type="hidden" name="botcatcher" id="botcatcher">

    <button type="submit">Send</button>
    <div id="status-message" class="message"></div>
  </form>

  <script>
    const form = document.getElementById('contact-form');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      statusMessage.className = 'message';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      // Client-side validation
      if (name.length < 2) {
        showMessage('Please enter your name.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
        return;
      }
      if (message.length < 10) {
        showMessage('Message should be at least 10 characters long.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
        return;
      }

      const formData = new URLSearchParams();
      formData.append('botcatcher', document.getElementById('botcatcher').value);
      formData.append('name', name);
      formData.append('email', email);
      formData.append('message', message);

      try {
        await fetch('https://script.google.com/macros/s/AKfycbww9_apndE1DZvLq6l7CmlllNJmmiQGBq4oyupSPUAtzhMYULQmye8jG9sjOxb7dqFe/exec', {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });
        showMessage('Thanks! Your message has been sent.', 'success');
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
        // Re-enable after 3 seconds
        setTimeout(() => {
          submitBtn.disabled = false;
        }, 3000);
      } catch (error) {
        showMessage('Network error. Please check your connection and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });

    function showMessage(text, type) {
      statusMessage.textContent = text;
      statusMessage.className = 'message ' + type;
    }
  </script>
</body>
</html>
